name: Sync ChatGPT Controller Cask

on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chatgpt-controller-homebrew-cask
  cancel-in-progress: false

jobs:
  sync:
    name: Sync latest public release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test cask generator
        run: node --test tests/chatgpt-controller-cask.test.mjs
      - name: Find latest public controller release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api repos/AungMyoKyaw/chatgpt-controller-desktop/releases/latest > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            echo "No public controller release available; skipping sync."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="$(jq -r .tag_name "$RUNNER_TEMP/release.json")"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Unexpected release tag: $TAG"; exit 1; }
          ZIP="ChatGPT-Controller-${TAG}-macos-arm64.zip"
          jq -e --arg n "$ZIP" '.assets | any(.name == $n)' "$RUNNER_TEMP/release.json" >/dev/null
          URL="$(jq -r '.assets[] | select(.name == "SHA256SUMS") | .browser_download_url' "$RUNNER_TEMP/release.json" | head -1)"
          [[ "$URL" == https://github.com/AungMyoKyaw/chatgpt-controller-desktop/releases/download/* ]] || {
            echo "::error::Missing expected checksums asset"; exit 1;
          }
          curl -fLsS --retry 3 "$URL" -o "$RUNNER_TEMP/SHA256SUMS"
          SHA="$(awk -v name="$ZIP" '$2 == name {print $1}' "$RUNNER_TEMP/SHA256SUMS")"
          [[ "$SHA" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "::error::Missing valid ZIP checksum"; exit 1; }
          {
            echo "available=true"
            echo "tag=$TAG"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"
      - name: Generate and validate cask
        if: steps.release.outputs.available == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          node scripts/update-chatgpt-controller-cask.mjs . "$TAG" "$SHA"
          ruby -c Casks/chatgpt-controller.rb
      - name: Commit only the generated cask
        if: steps.release.outputs.available == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git add Casks/chatgpt-controller.rb
          if git diff --cached --quiet; then
            echo "Cask already references the latest public release."
          else
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "cask: update chatgpt-controller to $TAG"
            git push origin HEAD:master
          fi
